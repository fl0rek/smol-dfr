[package]
name = "smol-dfr"
version = "0.3.7"
edition = "2021"
license = "GPL-3.0"
description = "Small but mighty dynamic function row daemon"
homepage = "https://github.com/AsahiLinux/tiny-dfr"
repository = "https://github.com/AsahiLinux/tiny-dfr.git"
# Forked from tiny-dfr (https://github.com/AsahiLinux/tiny-dfr)

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
screenshot = []

[dependencies]
drm = "0.14"
anyhow = "1"
input = "0.8"
libc = "0.2"
input-linux = { version = "0.7", features = ["serde"] }
input-linux-sys = "0.9"
nix = { version = "0.29", features = ["event", "signal", "inotify"] }
privdrop = "0.5.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["unstable-locales"] }
udev = "0.9"
niri-ipc = "=25.11.0"
iced_tiny_skia = { version = "0.13", features = ["svg"] }
iced_core = "0.13"
iced_widget = { version = "0.13", features = ["svg"] }
iced_graphics = "0.13"
iced_renderer = { version = "0.13", features = ["tiny-skia", "svg"] }
tiny-skia = "0.11"
libpulse-binding = "2.28"

[profile.release]
debug = true

# Lints live here rather than in CI so that every build, every editor and
# every agent working on this repo sees the same rules.
#
# Everything is `warn`, not `deny`: there is an existing backlog to burn down
# (CODE_REVIEW.md item 36) and a red build helps nobody while that is in
# progress. Tighten to `deny` once the count reaches zero.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Panic discipline. smol-dfr is a privilege-dropped daemon: main() already
# wraps real_main in catch_unwind and paints crash_bitmap.raw on the way
# down, so the project already treats a panic as a failure mode worth
# handling. These lints just make that belief checkable.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
indexing_slicing = "warn"

# Turned off after reviewing what `clippy --fix` actually produces for them:
# in this codebase each one trades readability for nothing.
#
#   suboptimal_flops - rewrites `body_w - 2.0 * outline` as
#                      `2.0f32.mul_add(-outline, body_w)`. Harder to read, and
#                      numerically different (FMA does not round the
#                      intermediate). Widget layout runs a handful of times per
#                      redraw, so there is no speed to buy.
#   redundant_pub_crate - rewrites `pub(crate)` to `pub`. Equivalent in a binary
#                      crate, but `pub(crate)` documents intent.
#   bool_to_int_with_if - collapses a three-way priority into
#                      `i32::from(!(a || b))`, which obscures what it computes.
#   redundant_closure_for_method_calls - replaces `|v| v.to_string()` with
#                      `std::string::ToString::to_string`, which is longer and
#                      less obvious than the closure it removes.
suboptimal_flops = "allow"
redundant_pub_crate = "allow"
bool_to_int_with_if = "allow"
redundant_closure_for_method_calls = "allow"

# Deliberately NOT enabled (all `restriction`-group, off by default):
#
#   as_conversions          - fires on infallible widening as well as lossy
#                             narrowing; pedantic's granular cast_* lints say
#                             the same thing with usable precision.
#   arithmetic_side_effects - written for arithmetic that is a security
#                             boundary; on framebuffer indices derived from a
#                             64x2048 buffer it is noise.
#   string_slice            - one hex-parsing site, already length-guarded.
