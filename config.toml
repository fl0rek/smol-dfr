# smol-dfr config template. Do not edit this file directly, instead
# copy it to /etc/smol-dfr/config.toml and edit that copy.
# The daemon will merge those two files, giving preference to the one in /etc

# F{number} keys are shown when Fn is not pressed by default.
# Set this to true if you want the media keys to be shown without Fn pressed
MediaLayerDefault = false

# Set this to false if you want to hide the button outline,
# leaving only the text/logo
ShowButtonOutlines = true

# Set this to the fontconfig pattern to be used to pick a font for text labels
# Some examples are:
# "" - default regular sans-serif font
# ":bold" - default bold sans-serif font
# For full reference on accepted values see the fontconfig user guide,
# section "Font Names"
# https://www.freedesktop.org/software/fontconfig/fontconfig-user.html
FontTemplate = ":bold"

FontFamily = "DejaVu Sans"
FontSize = 25
FontStyle = "bold"

# Set this to false if you want the brightness of the touchbar
# to be set to a static value instead of following the primary
# screen's brightness
AdaptiveBrightness = true

# With adaptive brightness disabled this is used as the brightness
# in the active state
# With it enabled, this is the maximum point on the brightness curve
# Accepted values are 0-255
ActiveBrightness = 200

# $base03:    #002b36;
# $base02:    #073642;
# $base01:    #586e75;
# $base00:    #657b83;
# $base0:     #839496;
# $base1:     #93a1a1;
# $base2:     #eee8d5;
# $base3:     #fdf6e3;
# $yellow:    #b58900;
# $orange:    #cb4b16;
# $red:       #dc322f;
# $magenta:   #d33682;
# $violet:    #6c71c4;
# $blue:      #268bd2;
# $cyan:      #2aa198;
# $green:     #859900;

# This key defines the contents of the primary layer
# (the one with F{number} keys)
# You can change the individual buttons, add, or remove them
# Any number of keys that is greater than 0 is allowed
# however rendering will start to break around 24 keys
# Buttons can be made larger by setting the optional Width field
# to a percentage of the total width.
PrimaryLayerKeys = [
    # Type defines the widget type. Required field.
    # Action defines the key code to send when the button is pressed.
    # You can specify either a single key, or a key combo by
    # setting this field to an array.
    # Width defines the percentage of total width (0-100). Unspecified
    # widths are auto-distributed among remaining widgets.
    # Color is an optional hex color string (e.g. "#FF8800").
    #
    # Widget types and their specific fields:
    #   text     - Text: button label string
    #   icon     - Icon: icon name, Theme: optional XDG icon theme
    #   time     - Format: strftime format string, Locale: optional locale
    #   battery  - Mode: "percentage", "icon", or "both"
    #   temperature - (no extra fields)
    #   load_avg    - (no extra fields)
    #   memory   - SampleInterval: ms (default 1000), GraphWindow: samples (default 60)
    #   workspaces  - (no extra fields, requires [Workspaces] section)
    #   window_title - (no extra fields)
    #   volume   - (no extra fields, requires [Volume] section)
    #   spacer   - (no extra fields)
    #
    # Icons can either be svgs or pngs, with svgs being preferred.
    # For best results with pngs, they should be 48x48.
    # Do not include the extension in the file name.
    # If a Theme is set, icons are looked up in XDG_DATA_DIRS.
    # Otherwise, they are first looked up in /etc/smol-dfr, then /usr/share/smol-dfr.
    # For the list of supported key codes see
    # https://docs.rs/input-linux/latest/input_linux/enum.Key.html
    # Note that the escape key is not specified here, as it is added
    # automatically on Macs without a physical one.

    # Example F-key row (commented out):
    #{ Type = "text", Text = "F1",  Action = "F1"  },
    #{ Type = "text", Text = "F2",  Action = "F2"  },
    #{ Type = "text", Text = "F3",  Action = "F3"  },
    #{ Type = "text", Text = "F4",  Action = "F4"  },
    #{ Type = "text", Text = "F5",  Action = "F5"  },
    #{ Type = "text", Text = "F6",  Action = "F6"  },
    #{ Type = "text", Text = "F7",  Action = "F7"  },
    #{ Type = "text", Text = "F8",  Action = "F8"  },
    #{ Type = "text", Text = "F9",  Action = "F9"  },
    #{ Type = "text", Text = "F10", Action = "F10" },
    #{ Type = "text", Text = "F11", Action = "F11" },
    #{ Type = "text", Text = "F12", Action = "F12" },

    { Type = "workspaces", Width = 16.0 },
    { Type = "window_title", Color = "#000000" },
    { Type = "temperature", Width = 4.0 },
    { Type = "load_avg", Width = 4.0 },
    { Type = "memory", Width = 5.0, Color = "#073642", SampleInterval = 1000, GraphWindow = 60 },
    { Type = "time", Format = "%H:%M", Action = "Time", Width = 4.0, Color = "#073642" },
    { Type = "time", Format = "%Y-%m-%d", Action = "Time", Width = 8.0, Color = "#073642" },
    { Type = "volume", Width = 7.0, Color = "#073642" },
    { Type = "battery", Mode = "percentage", Action = "Battery", Width = 5.0, Color = "#000000" },

    # Example with Width:
    # { Type = "text", Text = "F1", Action = "F1", Width = 10.0 },
    # { Type = "text", Text = "F2", Action = "F2", Width = 5.0 },

    # Example for a button that sends a key combination:
    # { Type = "text", Text = "TTY1", Action = [ "LeftCtrl", "LeftAlt", "F1" ] },

    # Example of Time:
    # { Type = "time", Format = "%I:%M %p", Action = "Time" },
    # Example of Time with locale:
    # { Type = "time", Format = "%I:%M %p", Locale = "en_IN", Action = "Time" },
    # You can also put in your format string directly.
    # The available variables can be found here: https://docs.rs/chrono/latest/chrono/format/strftime/index.html
    # If your time block says "Time format error" you are using some invalid parameter.
    # { Type = "time", Format = "%H:%M %-e.%m.%Y", Action = "Time", Width = 15.0 },

    # Example of Battery:
    # { Type = "battery", Mode = "percentage", Action = "Battery" }
    # This will display a button showing the current battery percentage.
    # { Type = "battery", Mode = "icon", Action = "Battery" }
    # This will display a button showing a battery icon instead of percentage.
    # { Type = "battery", Mode = "both", Action = "Battery" }
    # This will display a button showing a battery icon as well as percentage.

    # Example of a Spacer:
    # { Type = "spacer", Width = 10.0 }
]

# This key defines the contents of the media key layer
MediaLayerKeys = [
    { Type = "icon", Icon = "brightness_low",  Action = "BrightnessDown" },
    { Type = "icon", Icon = "brightness_high", Action = "BrightnessUp"   },
    { Type = "icon", Icon = "mic_off",         Action = "MicMute"        },
    { Type = "icon", Icon = "search",          Action = "Search"         },
    { Type = "icon", Icon = "backlight_low",   Action = "IllumDown"      },
    { Type = "icon", Icon = "backlight_high",  Action = "IllumUp"        },
    { Type = "icon", Icon = "fast_rewind",     Action = "PreviousSong"   },
    { Type = "icon", Icon = "play_pause",      Action = "PlayPause"      },
    { Type = "icon", Icon = "fast_forward",    Action = "NextSong"       },
    { Type = "icon", Icon = "volume_off",      Action = "Mute"           },
    { Type = "icon", Icon = "volume_down",     Action = "VolumeDown"     },
    { Type = "icon", Icon = "volume_up",       Action = "VolumeUp"       },

    # Example with XDG icons (requires `breeze-dark` theme installed):
    # { Type = "icon", Icon = "brightness-low",       Theme = "breeze-dark", Action = "BrightnessDown" },
    # { Type = "icon", Icon = "brightness-high",      Theme = "breeze-dark", Action = "BrightnessUp"   },
    # { Type = "icon", Icon = "microphone",           Theme = "breeze-dark", Action = "MicMute"        },
    # { Type = "icon", Icon = "search",               Theme = "breeze-dark", Action = "Search"         },
    # { Type = "icon", Icon = "redshift-status-day",  Theme = "breeze-dark", Action = "IllumDown"      },
    # { Type = "icon", Icon = "redshift-status-on",   Theme = "breeze-dark", Action = "IllumUp"        },
    # { Type = "icon", Icon = "media-skip-backward",  Theme = "breeze-dark", Action = "PreviousSong"   },
    # { Type = "icon", Icon = "media-playback-start", Theme = "breeze-dark", Action = "PlayPause"      },
    # { Type = "icon", Icon = "media-skip-forward",   Theme = "breeze-dark", Action = "NextSong"       },
    # { Type = "icon", Icon = "audio-volume-muted",   Theme = "breeze-dark", Action = "Mute"           },
    # { Type = "icon", Icon = "audio-volume-low",     Theme = "breeze-dark", Action = "VolumeDown"     },
    # { Type = "icon", Icon = "audio-volume-high",    Theme = "breeze-dark", Action = "VolumeUp"       },
]

[Workspaces]
Provider = "niri"

[Volume]
PulseServer = "unix:/run/user/1000/pulse/native"
